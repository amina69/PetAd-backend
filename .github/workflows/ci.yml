name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Step 1: Run Tests ───────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: petad
          POSTGRES_PASSWORD: petadpassword
          POSTGRES_DB: petad_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://petad:petadpassword@localhost:5432/petad_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-super-secret-jwt-key-for-ci-pipeline
      JWT_EXPIRATION: 7d
      PORT: 3000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

  # ─── Step 2: Build Check ─────────────────────────────────
  contract:
    name: OpenAPI Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://petad:petadpassword@localhost:5432/petad_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-super-secret-jwt-key-for-ci-pipeline
      JWT_EXPIRATION: 7d
      PORT: 3000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run contract tests
        run: npm run test:contract

      - name: Verify exported OpenAPI spec is up to date
        run: npm run check:openapi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json
          retention-days: 30

      - name: Prepare base spec for breaking-change detection
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          if git cat-file -e 'origin/${{ github.base_ref }}:docs/openapi.json' 2>/dev/null; then
            git show 'origin/${{ github.base_ref }}:docs/openapi.json' > /tmp/base-openapi.json
          else
            cp docs/openapi.json /tmp/base-openapi.json
          fi

      - name: Detect breaking API changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: /tmp/base-openapi.json
          revision: docs/openapi.json
          fail-on: ERR

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, contract] # Only runs if tests and contracts pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── Step 3: Deploy (only on push to main) ───────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build # Only runs if build passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # ── Replace this step with your actual deploy command ──
      # Example options shown below — uncomment the one you use:

      # Option A: Railway
      # - name: Deploy to Railway
      #   run: npx @railway/cli deploy
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Option B: Render (via deploy hook)
      # - name: Deploy to Render
      #   run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      # Option C: Docker Hub + SSH to your server
      # - name: Build and push Docker image
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      #     docker build -t yourname/petad-backend:latest .
      #     docker push yourname/petad-backend:latest

      - name: Deploy placeholder
        run: echo "✅ Tests and build passed. Add your deploy command above."
